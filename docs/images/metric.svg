<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <rect width="1000" height="420" rx="18" fill="#EAF3FB"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#1B365D">The metric: minutes with nothing open nearby</text>
  <text x="40" y="80" font-size="15" fill="#4A6283">Each sample point stands for some seconds of the trip. It counts as covered if any business within 100 m is open at that minute.</text>

  <!-- 100 m radii around open places -->
  <circle cx="260" cy="230" r="80" fill="#0fb463" fill-opacity=".12" stroke="#0fb463" stroke-dasharray="5 5"/>
  <circle cx="700" cy="230" r="80" fill="#0fb463" fill-opacity=".12" stroke="#0fb463" stroke-dasharray="5 5"/>
  <circle cx="470" cy="205" r="80" fill="#F57C1F" fill-opacity=".06" stroke="#F57C1F" stroke-dasharray="5 5"/>

  <!-- path: covered solid, uncovered dotted (as on the map) -->
  <line x1="80" y1="250" x2="180" y2="250" stroke="#F57C1F" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14"/>
  <line x1="180" y1="250" x2="335" y2="250" stroke="#0fb463" stroke-width="7" stroke-linecap="round"/>
  <line x1="335" y1="250" x2="625" y2="250" stroke="#F57C1F" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14"/>
  <line x1="625" y1="250" x2="770" y2="250" stroke="#0fb463" stroke-width="7" stroke-linecap="round"/>
  <line x1="770" y1="250" x2="830" y2="250" stroke="#F57C1F" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14"/>

  <!-- samples -->
  <g stroke="#1B365D" stroke-width="2" fill="#fff">
    <circle cx="120" cy="250" r="7"/><circle cx="210" cy="250" r="7" fill="#0fb463"/><circle cx="300" cy="250" r="7" fill="#0fb463"/>
    <circle cx="390" cy="250" r="7"/><circle cx="480" cy="250" r="7"/><circle cx="570" cy="250" r="7"/>
    <circle cx="660" cy="250" r="7" fill="#0fb463"/><circle cx="750" cy="250" r="7" fill="#0fb463"/>
  </g>

  <!-- places -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="236" y="198" width="48" height="26" rx="6" fill="#0fb463"/><text x="260" y="216" fill="#fff">Café</text>
    <text x="260" y="184" fill="#0b7a45">open 6 AM–10 PM</text>
    <rect x="440" y="180" width="60" height="26" rx="6" fill="#9aa3b5"/><text x="470" y="198" fill="#fff">Shop</text>
    <text x="470" y="166" fill="#B45309">closed at 7:05 PM</text>
    <rect x="676" y="198" width="48" height="26" rx="6" fill="#0fb463"/><text x="700" y="216" fill="#fff">Gas</text>
    <text x="700" y="184" fill="#0b7a45">open 24 hours</text>
  </g>

  <!-- wait stop -->
  <g font-size="13" fill="#1B365D">
    <rect x="828" y="230" width="34" height="40" rx="6" fill="#1B365D"/><text x="845" y="254" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">STOP</text>
    <text x="845" y="292" text-anchor="middle" font-weight="700">Wait 6 min</text>
    <text x="845" y="310" text-anchor="middle" fill="#4A6283">one sample per minute</text>
  </g>
  <text x="80" y="236" font-size="13" fill="#1B365D" font-weight="700">Start</text>

  <!-- legend -->
  <g font-size="14" fill="#1B365D">
    <line x1="40" y1="360" x2="80" y2="360" stroke="#0fb463" stroke-width="7" stroke-linecap="round"/><text x="92" y="365">covered: open place ≤ 100 m</text>
    <line x1="320" y1="360" x2="360" y2="360" stroke="#F57C1F" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14"/><text x="372" y="365">nothing open nearby (counted)</text>
    <text x="640" y="365" fill="#4A6283">“hours doubtful” places never count as open</text>
  </g>
  <text x="40" y="398" font-size="13" fill="#4A6283">Illustration only. Map colours in the app come from the same sample points as the number, so they always agree (plan.py _map).</text>
</svg>
