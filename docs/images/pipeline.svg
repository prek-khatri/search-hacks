<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B365D"/></marker>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#EAF3FB"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#1B365D">How a Stride request flows</text>
  <text x="40" y="80" font-size="15" fill="#4A6283">POST /api/plan  {origin, destination, end_time}  →  app/plan.py</text>

  <!-- column labels -->
  <g font-size="12" font-weight="700" fill="#4A6283" letter-spacing="1.5">
    <text x="40" y="122">STEP</text><text x="760" y="122">EXTERNAL SOURCE</text>
  </g>

  <!-- steps -->
  <g font-size="15" fill="#1B365D">
    <!-- 1 -->
    <rect x="40" y="135" width="620" height="54" rx="10" fill="#fff"/>
    <circle cx="70" cy="162" r="15" fill="#1B365D"/><text x="70" y="167" text-anchor="middle" fill="#fff" font-weight="800">1</text>
    <text x="98" y="158" font-weight="700">Routes · routes.py</text>
    <text x="98" y="178" font-size="13" fill="#4A6283">Default + bus / train / light rail / rail + leave +10/20/30 min → dedupe, keep ≤ 12</text>
    <!-- 2 -->
    <rect x="40" y="199" width="620" height="54" rx="10" fill="#fff"/>
    <circle cx="70" cy="226" r="15" fill="#1B365D"/><text x="70" y="231" text-anchor="middle" fill="#fff" font-weight="800">2</text>
    <text x="98" y="222" font-weight="700">Places · places.py</text>
    <text x="98" y="242" font-size="13" fill="#4A6283">6 categories × every stop, 16 queries per call; parse opening hours</text>
    <!-- 3 -->
    <rect x="40" y="263" width="620" height="54" rx="10" fill="#fff"/>
    <circle cx="70" cy="290" r="15" fill="#1B365D"/><text x="70" y="295" text-anchor="middle" fill="#fff" font-weight="800">3</text>
    <text x="98" y="286" font-weight="700">Minute by minute · metric.py</text>
    <text x="98" y="306" font-size="13" fill="#4A6283">Sample walks every ~80 m and waits every minute; open place within 100 m?</text>
    <!-- 4 -->
    <rect x="40" y="327" width="620" height="54" rx="10" fill="#fff"/>
    <circle cx="70" cy="354" r="15" fill="#1B365D"/><text x="70" y="359" text-anchor="middle" fill="#fff" font-weight="800">4</text>
    <text x="98" y="350" font-weight="700">Hours check · verify.py</text>
    <text x="98" y="370" font-size="13" fill="#4A6283">Top 5 places the numbers depend on: reviews + web search → confirmed / listed / uncertain</text>
    <!-- 5 -->
    <rect x="40" y="391" width="620" height="54" rx="10" fill="#fff"/>
    <circle cx="70" cy="418" r="15" fill="#1B365D"/><text x="70" y="423" text-anchor="middle" fill="#fff" font-weight="800">5</text>
    <text x="98" y="414" font-weight="700">Rank · plan.py</text>
    <text x="98" y="434" font-size="13" fill="#4A6283">Re-score without doubtful places, suggest waiting inside, pick Google vs Stride 1 &amp; 2</text>
    <!-- 6 -->
    <rect x="40" y="455" width="620" height="54" rx="10" fill="#fff"/>
    <circle cx="70" cy="482" r="15" fill="#1B365D"/><text x="70" y="487" text-anchor="middle" fill="#fff" font-weight="800">6</text>
    <text x="98" y="478" font-weight="700">Conditions · conditions.py</text>
    <text x="98" y="498" font-size="13" fill="#4A6283">Temperature, rain chance, daylight and AQI at departure</text>
  </g>

  <!-- sources -->
  <g font-size="14" font-weight="700">
    <rect x="760" y="135" width="200" height="54" rx="10" fill="#1B365D"/>
    <text x="860" y="167" text-anchor="middle" fill="#fff">Google Routes API</text>
    <rect x="760" y="199" width="200" height="54" rx="10" fill="#F57C1F"/>
    <text x="860" y="222" text-anchor="middle" fill="#fff">Telem</text>
    <text x="860" y="241" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">outscraper_gmaps</text>
    <rect x="760" y="327" width="200" height="54" rx="10" fill="#F57C1F"/>
    <text x="860" y="347" text-anchor="middle" fill="#fff">Telem + Claude Haiku</text>
    <text x="860" y="367" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">greviews · web search · extract</text>
    <rect x="760" y="455" width="200" height="54" rx="10" fill="#fff" stroke="#1B365D" stroke-width="2"/>
    <text x="860" y="487" text-anchor="middle" fill="#1B365D">Open-Meteo</text>
  </g>
  <g stroke="#1B365D" stroke-width="2" marker-end="url(#a)">
    <line x1="756" y1="162" x2="666" y2="162"/>
    <line x1="756" y1="226" x2="666" y2="226"/>
    <line x1="756" y1="354" x2="666" y2="354"/>
    <line x1="756" y1="482" x2="666" y2="482"/>
  </g>
  <text x="40" y="540" font-size="13" fill="#4A6283">Every external response is cached on disk in cache/ (core.py), so repeat trips load instantly.</text>
</svg>
