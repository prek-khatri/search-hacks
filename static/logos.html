<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride logo options</title>
<style>
:root{--lb:#EAF3FB;--lb2:#D3E6F6;--navy:#1B365D;--or:#F57C1F;--gr:#0fb463}
body{margin:0;background:var(--lb);color:var(--navy);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:1000px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0 0 4px;font-size:26px}p.lead{margin:0 0 24px;color:#4A6283}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.opt{background:#fff;border-radius:20px;padding:22px;box-shadow:0 2px 12px rgba(27,54,93,.08)}
.opt h2{margin:0 0 2px;font-size:18px}.opt .why{color:#4A6283;font-size:14px;margin:0 0 16px}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lockup{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px}
.lockup.light{background:var(--lb)}.lockup.dark{background:var(--navy)}
.word{font-weight:900;font-style:italic;font-size:34px;letter-spacing:.02em}
.light .word{color:var(--navy)}.dark .word{color:#fff}
.icon64 svg{width:64px;height:64px;display:block}.icon40 svg{width:44px;height:44px;display:block}
.appicon{width:76px;height:76px;border-radius:18px;overflow:hidden;box-shadow:0 4px 12px rgba(27,54,93,.25)}
.appicon svg{width:100%;height:100%;display:block}
.cap{font-size:12px;color:#4A6283;margin-top:6px;text-align:center}
</style>
</head>
<body>
<main>
<h1>Stride logo options</h1>
<p class="lead">Each mark tells the product story: a route, the dotted stretch with nothing open, and the open door at the end. Shown as an app icon, on light, and on navy.</p>
<div class="grid" id="grid"></div>
</main>
<script>
const LOGOS = {
  A: {name: "A · Route S", why: "The S is a route. Top half dotted orange (nothing open), bottom half solid green (open doors), start and end pins.",
    svg: `<svg viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#1B365D"/>
      <path d="M82 32 H52 a15 15 0 0 0 0 30" fill="none" stroke="#F57C1F" stroke-width="10" stroke-linecap="round" stroke-dasharray="0.1 16"/>
      <path d="M52 62 H68 a15 15 0 0 1 0 30 H38" fill="none" stroke="#0fb463" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="84" cy="32" r="8" fill="#fff"/><circle cx="84" cy="32" r="3.5" fill="#1B365D"/>
      <circle cx="36" cy="92" r="8" fill="#F57C1F"/><circle cx="36" cy="92" r="3.5" fill="#fff"/></svg>`},
  B: {name: "B · Open door", why: "An open doorway with warm light spilling out, and a path walking into it. Direct and friendly.",
    svg: `<svg viewBox="0 0 120 120"><defs><linearGradient id="glowB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F57C1F" stop-opacity=".9"/><stop offset="1" stop-color="#F57C1F" stop-opacity="0"/></linearGradient></defs>
      <rect width="120" height="120" rx="28" fill="#1B365D"/>
      <path d="M40 84 V46 a20 20 0 0 1 40 0 V84 Z" fill="#F57C1F"/>
      <path d="M40 84 H80 L96 108 H24 Z" fill="url(#glowB)"/>
      <path d="M58 46 V84" stroke="#1B365D" stroke-width="3" opacity=".25"/>
      <path d="M60 108 C60 100 54 96 58 90" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 9"/>
      <circle cx="60" cy="40" r="4" fill="#fff"/></svg>`},
  C: {name: "C · Step pin", why: "A map pin made of two footsteps: walking plus place. Reads clearly even very small.",
    svg: `<svg viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#EAF3FB"/>
      <path d="M60 16c-18 0-32 14-32 32 0 24 32 56 32 56s32-32 32-56c0-18-14-32-32-32z" fill="#1B365D"/>
      <ellipse cx="51" cy="52" rx="7" ry="11" fill="#F57C1F" transform="rotate(-12 51 52)"/><circle cx="49" cy="36" r="3.5" fill="#F57C1F"/>
      <ellipse cx="69" cy="44" rx="7" ry="11" fill="#0fb463" transform="rotate(12 69 44)"/><circle cx="71" cy="28" r="3.5" fill="#0fb463"/></svg>`},
  D: {name: "D · Stride mark", why: "A forward-leaning slash-stride, like a step in motion, with a green 'open' dot. Most minimal and brand-like.",
    svg: `<svg viewBox="0 0 120 120"><rect width="120" height="120" rx="28" fill="#1B365D"/>
      <path d="M34 86 L58 34" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
      <path d="M58 86 L82 34" stroke="#F57C1F" stroke-width="13" stroke-linecap="round"/>
      <circle cx="88" cy="86" r="8" fill="#0fb463"/></svg>`},
};
document.getElementById("grid").innerHTML = Object.entries(LOGOS).map(([k, l]) => `
  <div class="opt"><h2>${l.name}</h2><p class="why">${l.why}</p>
    <div class="row">
      <div><div class="appicon">${l.svg}</div><div class="cap">App icon</div></div>
      <div class="lockup light"><span class="icon40">${l.svg}</span><span class="word">STRIDE</span></div>
      <div class="lockup dark"><span class="icon40">${l.svg}</span><span class="word">STRIDE</span></div>
    </div></div>`).join("");
</script>
</body>
</html>
